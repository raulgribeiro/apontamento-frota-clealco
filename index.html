<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<title>Apontamento de Frota — Manutenção Automotiva Clealco</title>
<style>
  :root{
    --bg:#F7F8FA;
    --surface:#FFFFFF;
    --surface-2:#F1F3F6;
    --surface-3:#E6E9ED;
    --border:#E2E5EA;
    --border-strong:#D3D7DE;
    --text:#3C4048;
    --text-muted:#8A909B;

    --green:#58CC02; --green-shadow:#46A302; --green-soft:#E6F7D9;
    --blue:#1CB0F6; --blue-shadow:#1899D6; --blue-soft:#E1F5FE;
    --yellow:#FFC800; --yellow-shadow:#E6A800; --yellow-soft:#FFF6DA;
    --red:#FF4B4B; --red-shadow:#E63E3E; --red-soft:#FFE7E7;
    --purple:#CE82FF; --purple-shadow:#B15CE6; --purple-soft:#F4E7FF;
    --gray-soft:#EEF0F3;

    --accent:var(--green); --accent-shadow:var(--green-shadow); --accent-soft:var(--green-soft); --accent-contrast:#FFFFFF;
    --shadow: rgba(60,64,72,0.08);
    --font-display:'Fredoka','Baloo 2',sans-serif;
    --font-body:'Nunito','Segoe UI',sans-serif;
    --font-mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#131F24; --surface:#1B2A31; --surface-2:#22333B; --surface-3:#2B3E47;
      --border:#31454E; --border-strong:#3D545F; --text:#EAF2F5; --text-muted:#8FA3AC;
      --green:#58CC02; --green-shadow:#3E8E02; --green-soft:#1F3311;
      --blue:#3BC1FF; --blue-shadow:#1C93C9; --blue-soft:#0F2C38;
      --yellow:#FFC800; --yellow-shadow:#C99A00; --yellow-soft:#3A2E0C;
      --red:#FF5B5B; --red-shadow:#C93F3F; --red-soft:#3A1414;
      --purple:#D79BFF; --purple-shadow:#9A5FCB; --purple-soft:#2A1B38;
      --gray-soft:#2B3E47;
      --accent:var(--green); --accent-shadow:var(--green-shadow); --accent-soft:var(--green-soft); --accent-contrast:#0A1410;
      --shadow: rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#131F24; --surface:#1B2A31; --surface-2:#22333B; --surface-3:#2B3E47;
    --border:#31454E; --border-strong:#3D545F; --text:#EAF2F5; --text-muted:#8FA3AC;
    --green:#58CC02; --green-shadow:#3E8E02; --green-soft:#1F3311;
    --blue:#3BC1FF; --blue-shadow:#1C93C9; --blue-soft:#0F2C38;
    --yellow:#FFC800; --yellow-shadow:#C99A00; --yellow-soft:#3A2E0C;
    --red:#FF5B5B; --red-shadow:#C93F3F; --red-soft:#3A1414;
    --purple:#D79BFF; --purple-shadow:#9A5FCB; --purple-soft:#2A1B38;
    --gray-soft:#2B3E47;
    --accent:var(--green); --accent-shadow:var(--green-shadow); --accent-soft:var(--green-soft); --accent-contrast:#0A1410;
    --shadow: rgba(0,0,0,0.5);
  }

  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--font-body); font-size:15px; line-height:1.45;
    -webkit-tap-highlight-color:transparent;
  }
  #app{ min-height:100vh; }
  .app-shell{ display:flex; min-height:100vh; }

  /* ---------- Side nav (desktop/tablet) ---------- */
  .sidenav{
    display:none; flex-direction:column; width:236px; flex-shrink:0;
    border-right:2px solid var(--border); padding:20px 14px; gap:4px;
    position:sticky; top:0; height:100vh; background:var(--surface);
  }
  @media (min-width:860px){ .sidenav{ display:flex; } }
  .sidenav-brand{ display:flex; align-items:center; gap:10px; padding:6px 8px 22px; }
  .sidenav-mark{
    width:40px; height:40px; border-radius:12px; background:#fff; padding:5px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    box-shadow:0 3px 0 var(--border-strong); border:2px solid var(--border);
  }
  .sidenav-mark img{ width:100%; height:100%; object-fit:contain; display:block; }
  .sidenav-title{ font-family:var(--font-display); font-weight:700; font-size:17px; line-height:1.1; }
  .sidenav-sub{ font-size:10.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }
  .nav-item{
    display:flex; align-items:center; gap:12px; padding:12px 12px; border-radius:14px; border:2px solid transparent;
    font-family:var(--font-display); font-weight:600; font-size:14.5px; color:var(--text-muted);
    background:none; text-align:left; width:100%;
  }
  .nav-item .nav-ico{
    width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    font-size:16px; background:var(--surface-2); flex-shrink:0;
  }
  .nav-item:active{ background:var(--surface-2); }
  .nav-item.active{ color:var(--green); background:var(--green-soft); border-color:var(--green); }
  .nav-item.active .nav-ico{ background:var(--green); color:#fff; }
  .sidenav-footer{ margin-top:auto; padding-top:10px; border-top:2px solid var(--border); }

  /* ---------- Bottom nav (mobile) ---------- */
  .bottomnav{
    display:flex; position:fixed; left:0; right:0; bottom:0; z-index:25;
    background:var(--surface); border-top:2px solid var(--border);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  @media (min-width:860px){ .bottomnav{ display:none; } }
  .bottomnav .nav-item{ flex-direction:column; gap:3px; padding:7px 4px; font-size:11px; border-radius:12px; align-items:center; }
  .bottomnav .nav-item .nav-ico{ width:30px; height:30px; }

  .content-col{ flex:1; min-width:0; display:flex; flex-direction:column; }

  .shell{ max-width:680px; margin:0 auto; width:100%; padding-inline:16px; }

  .topbar{
    position:sticky; top:0; z-index:20; background:var(--surface);
    border-bottom:2px solid var(--border);
  }
  .topbar-inner{
    max-width:680px; margin:0 auto; padding:14px 16px;
    display:flex; align-items:center; gap:10px;
  }
  .brand{ display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
  .brand-mark{
    width:38px; height:38px; border-radius:11px; background:#fff; padding:5px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; box-shadow:0 3px 0 var(--border-strong); border:2px solid var(--border);
  }
  .brand-mark img{ width:100%; height:100%; object-fit:contain; display:block; }
  .brand-text{ min-width:0; }
  .brand-title{
    font-family:var(--font-display); font-weight:700; font-size:19px; line-height:1;
  }
  .brand-sub{ font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; margin-top:3px; }
  .theme-btn{
    width:38px; height:38px; border-radius:12px; background:var(--surface-2); border:2px solid var(--border);
    font-size:17px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
    box-shadow:0 3px 0 var(--border-strong);
  }
  .theme-btn:active{ transform:translateY(3px); box-shadow:none; }
  .role-pill{
    font-family:var(--font-display); font-weight:600; font-size:12.5px; letter-spacing:.02em;
    padding:8px 13px; border-radius:100px; background:var(--surface-2); color:var(--text-muted);
    border:2px solid var(--border); white-space:nowrap;
  }
  .role-pill:active{ background:var(--surface-3); }
  @media (min-width:860px){ .role-pill{ display:none; } }

  main{ flex:1; padding-block:18px 96px; }
  @media (min-width:860px){ main{ padding-block:26px 40px; } }

  h1,h2,h3{ font-family:var(--font-display); font-weight:700; letter-spacing:.1px; text-wrap:balance; margin:0; }
  h1{ font-size:26px; }
  h2{ font-size:19px; }
  h3{ font-size:16px; }
  p{ margin:0; }
  .muted{ color:var(--text-muted); }
  .eyebrow{
    font-family:var(--font-display); font-size:12.5px; font-weight:600; letter-spacing:.07em;
    text-transform:uppercase; color:var(--text-muted);
  }
  .mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }

  .card{
    background:var(--surface); border:2px solid var(--border); border-radius:18px;
    padding:16px; box-shadow:0 2px 0 var(--shadow);
  }
  .stack{ display:flex; flex-direction:column; gap:14px; }
  .row{ display:flex; gap:10px; align-items:center; }
  .row-between{ display:flex; gap:10px; align-items:center; justify-content:space-between; }

  .banner{
    display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:14px;
    font-size:13.5px; font-weight:700; border:2px solid;
  }
  .banner-warn{ background:var(--yellow-soft); border-color:var(--yellow); color:#8A6800; }
  .banner-danger{ background:var(--red-soft); border-color:var(--red); color:var(--red); }
  .banner-ok{ background:var(--green-soft); border-color:var(--green); color:var(--green-shadow); }
  :root[data-theme="dark"] .banner-warn{ color:var(--yellow); }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .banner-warn{ color:var(--yellow); } }

  label.field-label{
    display:block; font-family:var(--font-display); font-weight:600; font-size:13.5px;
    letter-spacing:.02em; margin-bottom:6px; color:var(--text);
  }
  input[type="text"], input[type="number"], input[type="date"], select, textarea{
    width:100%; font-family:var(--font-body); font-weight:600; font-size:15px; color:var(--text);
    background:var(--surface-2); border:2px solid var(--border); border-radius:12px;
    padding:11px 13px; outline:none;
  }
  input:focus, select:focus, textarea:focus{ border-color:var(--blue); background:var(--surface); }
  textarea{ resize:vertical; min-height:64px; font-family:var(--font-body); font-weight:500; }
  .field{ display:flex; flex-direction:column; }
  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:420px){ .field-grid{ grid-template-columns:1fr; } }

  button{ font-family:var(--font-body); cursor:pointer; }
  .btn{
    appearance:none; border:none; border-radius:14px;
    padding:13px 18px; font-size:15px; font-weight:700; font-family:var(--font-display);
    letter-spacing:.02em; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .04s ease;
  }
  .btn-primary{ background:var(--green); color:#fff; box-shadow:0 4px 0 var(--green-shadow); }
  .btn-primary:active{ transform:translateY(4px); box-shadow:0 0 0 var(--green-shadow); }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-secondary{ background:var(--surface-2); color:var(--text); box-shadow:0 4px 0 var(--border-strong); }
  .btn-secondary:active{ transform:translateY(4px); box-shadow:0 0 0 var(--border-strong); }
  .btn-blue{ background:var(--blue); color:#fff; box-shadow:0 4px 0 var(--blue-shadow); }
  .btn-blue:active{ transform:translateY(4px); box-shadow:0 0 0 var(--blue-shadow); }
  .btn-ghost{ background:transparent; color:var(--blue); padding:8px 6px; box-shadow:none; }
  .btn-danger-ghost{ background:transparent; color:var(--red); padding:8px 6px; box-shadow:none; }
  .btn-block{ width:100%; }
  .btn-sm{ padding:9px 13px; font-size:13.5px; border-radius:11px; }

  .role-choice{ display:flex; flex-direction:column; gap:12px; margin-top:18px; }
  .role-card{
    background:var(--surface); border:2px solid var(--border); border-radius:18px;
    padding:18px; text-align:left; display:flex; gap:14px; align-items:center;
    box-shadow:0 3px 0 var(--border-strong);
  }
  .role-card:active{ transform:translateY(3px); box-shadow:none; }
  .role-icon{
    width:46px; height:46px; border-radius:13px; display:flex; align-items:center; justify-content:center;
    font-size:22px; flex-shrink:0; color:#fff;
  }
  .role-icon.green{ background:var(--green); }
  .role-icon.blue{ background:var(--blue); }

  .steps{ display:flex; gap:6px; margin-bottom:16px; }
  .step-dot{ flex:1; height:8px; border-radius:100px; background:var(--surface-3); }
  .step-dot.done{ background:var(--green); }
  .step-dot.current{ background:var(--blue); }
  .step-label{ font-family:var(--font-display); font-size:12.5px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:14px; }

  .photo-box{
    border:2.5px dashed var(--border-strong); border-radius:16px; background:var(--surface-2);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    padding:20px; text-align:center; min-height:120px; position:relative; overflow:hidden;
  }
  .photo-box img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .photo-box .photo-caption{ position:relative; z-index:1; font-size:13px; font-weight:700; color:var(--text-muted); }
  .photo-box.filled .photo-caption{ display:none; }
  .photo-retake{
    position:absolute; right:8px; top:8px; z-index:2; background:rgba(0,0,0,.6); color:#fff;
    border:none; border-radius:10px; padding:6px 11px; font-size:12px; font-family:var(--font-display); font-weight:700;
  }
  .photo-box.item-photo.missing{ border-color:var(--red); background:var(--red-soft); }
  .photo-box.item-photo .photo-caption{ color:var(--red); }
  .photo-box.item-photo.filled .photo-caption{ color:var(--text-muted); }

  .segmented{ display:flex; border:2px solid var(--border); border-radius:12px; overflow:hidden; }
  .segmented button{
    flex:1; border:none; background:var(--surface-2); color:var(--text-muted); padding:10px 4px;
    font-family:var(--font-display); font-weight:700; font-size:13px; letter-spacing:.02em;
    border-right:2px solid var(--border);
  }
  .segmented button:last-child{ border-right:none; }
  .segmented button.active[data-val="ok"]{ background:var(--green); color:#fff; }
  .segmented button.active[data-val="problema"]{ background:var(--red); color:#fff; }
  .segmented button.active[data-val="na"]{ background:var(--surface-3); color:var(--text); }

  .checklist-section{ margin-bottom:4px; }
  .checklist-section-title{
    font-family:var(--font-display); font-weight:700; font-size:14px; letter-spacing:.02em;
    padding:9px 0 7px; color:var(--blue); border-bottom:2px solid var(--border); margin-bottom:10px;
  }
  .checklist-item{ padding:10px 0; border-bottom:1px solid var(--border); }
  .checklist-item:last-child{ border-bottom:none; }
  .checklist-item-head{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; margin-bottom:9px; }
  .checklist-item-text{ font-size:14px; font-weight:600; }
  .checklist-item-num{ font-family:var(--font-mono); color:var(--text-muted); font-size:12.5px; margin-right:6px; font-weight:400;}

  .pill{
    display:inline-flex; align-items:center; gap:5px; padding:4px 11px; border-radius:100px;
    font-family:var(--font-display); font-weight:700; font-size:12px; letter-spacing:.03em; text-transform:uppercase;
    white-space:nowrap;
  }
  .pill-yellow{ background:var(--yellow-soft); color:#8A6800; }
  .pill-blue{ background:var(--blue-soft); color:var(--blue-shadow); }
  .pill-green{ background:var(--green-soft); color:var(--green-shadow); }
  .pill-gray{ background:var(--gray-soft); color:var(--text-muted); }
  .pill-red{ background:var(--red-soft); color:var(--red); }
  @media (prefers-color-scheme:dark){ .pill-yellow{ color:var(--yellow); } }
  :root[data-theme="dark"] .pill-yellow{ color:var(--yellow); }
  :root[data-theme="dark"] .pill-blue{ color:var(--blue); }
  :root[data-theme="dark"] .pill-green{ color:var(--green); }

  .part-row{ display:flex; gap:8px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--border); }
  .part-row:last-child{ border-bottom:none; }
  .part-row .field{ flex:1; }
  .part-remove{ background:none; border:none; color:var(--red); font-size:22px; line-height:1; padding:8px 4px; margin-top:4px; font-weight:700; }

  .os-card{
    background:var(--surface); border:2px solid var(--border); border-radius:16px; padding:14px;
    display:flex; flex-direction:column; gap:8px; text-align:left; width:100%;
    box-shadow:0 2px 0 var(--shadow);
  }
  .os-card:active{ transform:translateY(1px); }
  .os-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .os-code{ font-family:var(--font-mono); font-size:12.5px; color:var(--text-muted); }
  .os-frota{ font-family:var(--font-display); font-weight:700; font-size:17px; }
  .os-meta{ font-size:12.5px; color:var(--text-muted); display:flex; gap:10px; flex-wrap:wrap; font-weight:600; }

  .tabs{ display:flex; gap:6px; margin-bottom:14px; background:var(--surface-2); padding:5px; border-radius:14px; }
  .tab-btn{
    flex:1; border:none; background:transparent; color:var(--text-muted); padding:10px 6px; border-radius:10px;
    font-family:var(--font-display); font-weight:700; font-size:13.5px; letter-spacing:.02em;
  }
  .tab-btn.active{ background:var(--surface); color:var(--green); box-shadow:0 2px 0 var(--shadow); }

  .action-bar{
    position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:2px solid var(--border);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom)); z-index:30;
  }
  @media (min-width:860px){ .action-bar{ left:236px; } }
  .action-bar-inner{ max-width:680px; margin:0 auto; display:flex; gap:10px; }
  .action-bar-inner .btn{ flex:1; }

  .empty-state{ text-align:center; padding:34px 16px; color:var(--text-muted); font-weight:600; }
  .empty-state .icon{ font-size:32px; margin-bottom:8px; }

  canvas.sig-pad{
    width:100%; height:150px; border-radius:14px; border:2.5px dashed var(--border-strong);
    background:var(--surface-2); touch-action:none; display:block;
  }

  .divider{ height:1px; background:var(--border); border:none; margin:2px 0; }
  .back-link{ display:inline-flex; align-items:center; gap:5px; color:var(--text-muted); font-size:13.5px; font-weight:700; background:none; border:none; padding:4px 0; margin-bottom:10px; font-family:var(--font-body); }
  .back-link:active{ color:var(--text); }

  .checkbox-row{ display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--border); }
  .checkbox-row:last-child{ border-bottom:none; }
  .checkbox-row input[type="checkbox"]{ width:20px; height:20px; margin-top:2px; accent-color:var(--green); flex-shrink:0; }
  .checkbox-row-text{ flex:1; font-weight:600; }

  .kpi-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .kpi{ background:var(--surface); border:2px solid var(--border); border-radius:15px; padding:12px 10px; text-align:center; }
  .kpi-num{ font-family:var(--font-display); font-weight:700; font-size:23px; }
  .kpi-label{ font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; margin-top:1px; font-weight:700; }
  .kpi.green .kpi-num{ color:var(--green); }
  .kpi.blue .kpi-num{ color:var(--blue); }
  .kpi.yellow .kpi-num{ color:#8A6800; }
  :root[data-theme="dark"] .kpi.yellow .kpi-num{ color:var(--yellow); }

  .filter-bar{ display:flex; flex-direction:column; gap:10px; margin-bottom:14px; }
  .filter-row{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  @media (max-width:420px){ .filter-row{ grid-template-columns:1fr 1fr; } }

  a{ color:var(--blue); }
  ::selection{ background:var(--green-soft); }
</style>

</head>

function blobUrlToBase64(url){
return fetch(url).then(function(r){ return r.blob(); }).then(function(blob){
return new Promise(function(resolve){
var reader = new FileReader();
reader.onload = function(){
var res = reader.result || "";
var comma = res.indexOf(",");
resolve(comma>-1 ? res.slice(comma+1) : "");
};
reader.onerror = function(){ resolve(null); };
reader.readAsDataURL(blob);
});
});
}
function buildItensComProblemaText(os){
var tmpl = CHECKLIST_TEMPLATES[os.frotaTipo] || {};
var lines = [];
Object.keys(os.checklist||{}).forEach(function(k){
var c = os.checklist[k];
if(c && c.status==="problema"){
var item = null;
(tmpl.sections||[]).forEach(function(s){ s.items.forEach(function(it){ if(it.id===k) item=it; }); });
lines.push(k + " " + (item?item.text:"") + (c.obs?(" — "+c.obs):""));
}
});
return lines.join("; ");
}
function buildPecasSolicitadasText(os){
return (os.pecas||[]).map(function(p){
return p.nome + " (x" + (p.qtd||"1") + ")" + (p.obs?(" — "+p.obs):"");
}).join("; ");
}

try{

if(os.equipamentoAssetId){ photoJobs.push({ nome: "equipamento_" + os.osCode + ".jpg", url: assetUrl(os.equipamentoAssetId) }); }
Object.keys(os.checklist||{}).forEach(function(k){
var c = os.checklist[k];
if(c && c.status==="problema" && c.fotoAssetId){
photoJobs.push({ nome: "problema_" + k + "_" + os.osCode + ".jpg", url: assetUrl(c.fotoAssetId) });

});
Promise.all(photoJobs.map(function(job){

}).catch(function(){ return null; });

  function copyToClipboard(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text).then(function(){ return true; }).catch(function(){ return copyFallback(text); });
    }
    return Promise.resolve(copyFallback(text));
  }
  function copyFallback(text){
    try{
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    }catch(e){ return false; }
  }
  function assetUrl(id){

  }
  function blobToDataUrl(blob){
    return new Promise(function(resolve){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = function(){ resolve(null); };
      reader.readAsDataURL(blob);
    });
  }

      '<div><p class="eyebrow">Bem-vindo</p><h1 style="margin-top:4px;">'+escapeHtml(state.mecNome||"Mecânico")+' 👋</h1>'+
      '<p class="mono muted" style="margin-top:2px; font-weight:600;">Matrícula '+escapeHtml(state.mecMatricula||"—")+'</p></div>'+
      '</div>';
    html += '<button class="btn btn-primary btn-block" data-action="new-apontamento" style="padding:17px;">➕ Novo apontamento</button>';

    html += '<div class="kpi-row">'+
      '<div class="kpi yellow"><div class="kpi-num">'+pending.length+'</div><div class="kpi-label">Em aberto</div></div>'+
      '<div class="kpi green"><div class="kpi-num">'+done.length+'</div><div class="kpi-label">Concluídas</div></div>'+
      '<div class="kpi blue"><div class="kpi-num">'+mine.length+'</div><div class="kpi-label">Total</div></div>'+
    '</div>';

    html += '<h2 style="margin-top:6px;">Minhas OS em aberto</h2>';
    if(pending.length===0){
      html += '<div class="empty-state"><div class="icon">✅</div>Nenhuma OS pendente no momento.</div>';
    } else {
      html += '<div class="stack">' + pending.map(renderMecOsCard).join("") + '</div>';
    }
    if(done.length){
      html += '<h2 style="margin-top:10px;">Histórico recente</h2>';
      html += '<div class="stack">' + done.slice(0,4).map(renderMecOsCard).join("") + '</div>';
      html += '<button class="btn btn-ghost" data-action="nav-goto" data-route="consulta">Ver todos os serviços →</button>';
    }
    html += '</div>';
    return html;
  }

  function renderMecOsCard(o){
    var actionLabel = null, action = null;
    if(o.status==="pecas_pendentes"){ actionLabel = "Aguardando o líder separar as peças"; }
    if(o.status==="aguardando_assinatura"){ actionLabel = "Assinar recebimento de peças →"; action="open-signature"; }
    if(o.status==="aguardando_aplicacao"){ actionLabel = "Marcar peças aplicadas →"; action="open-apply"; }
    var tmpl = CHECKLIST_TEMPLATES[o.frotaTipo] || {label:o.frotaTipo};
    var body = (
      '<div class="os-top">'+
        '<div><div class="os-frota">'+escapeHtml(tmpl.label)+' '+escapeHtml(o.frotaNumero)+'</div>'+
        '<div class="os-code">'+escapeHtml(o.osCode)+'</div></div>'+
        '<span class="pill '+(STATUS_PILL_CLASS[o.status]||"pill-gray")+'">'+(STATUS_LABEL[o.status]||o.status)+'</span>'+
      '</div>'+
      '<div class="os-meta"><span>🕓 '+fmtDate(o.dataServico)+'</span><span>⚙️ '+(o.pecas?o.pecas.length:0)+' peça(s)</span></div>'+
      (actionLabel ? '<div style="font-size:13.5px; font-weight:700; color:'+(action?"var(--blue)":"var(--text-muted)")+'; margin-top:2px;">'+actionLabel+'</div>' : '')
    );
    if(action){ return '<button class="os-card" data-action="'+action+'" data-id="'+o.id+'">'+body+'</button>'; }
    return '<div class="os-card" style="cursor:default;">'+body+'</div>';
  }

  function viewMecWizard(){
    var w = state.wizard;
    var titles = ["Identificação","Checklist","Peças necessárias","Revisão"];
    var dots = "";
    for(var i=1;i<=4;i++){ dots += '<div class="step-dot '+(i<w.step?"done":(i===w.step?"current":""))+'"></div>'; }
    var html = '<div class="steps">'+dots+'</div>';
    html += '<div class="step-label">Etapa '+w.step+' de 4 · '+titles[w.step-1]+'</div>';
    if(w.step===1) html += stepIdentificacao(w);
    else if(w.step===2) html += stepChecklist(w);
    else if(w.step===3) html += stepPecas(w);
    else html += stepRevisao(w);
    return html;
  }

  function stepIdentificacao(w){
    var opts = FROTA_TIPOS.map(function(t){
      return '<option value="'+t+'" '+(w.frotaTipo===t?"selected":"")+'>'+CHECKLIST_TEMPLATES[t].label+'</option>';
    }).join("");
    return (
      '<div class="stack">'+
        '<div class="card stack">'+
          '<h3>Você</h3>'+
          '<div class="field"><label class="field-label">Nome do mecânico</label>'+
            '<input type="text" id="in-mecNome" value="'+escapeHtml(state.mecNome)+'" placeholder="Nome completo" autocomplete="off">'+
          '</div>'+
          '<div class="field"><label class="field-label">Matrícula</label>'+
            '<input type="text" id="in-mecMatricula" class="mono" value="'+escapeHtml(state.mecMatricula)+'" placeholder="Ex.: 4521" autocomplete="off">'+
          '</div>'+
          '<div class="field"><label class="field-label">Foto do crachá (opcional)</label>'+ renderPhotoBox("cracha", w.crachaAssetId)+'</div>'+
        '</div>'+
        '<div class="card stack">'+
          '<h3>Equipamento</h3>'+
          '<div class="field-grid">'+
            '<div class="field"><label class="field-label">Frota (tipo)</label><select id="in-frotaTipo">'+opts+'</select></div>'+
            '<div class="field"><label class="field-label">Número da frota</label><input type="text" id="in-frotaNumero" class="mono" value="'+escapeHtml(w.frotaNumero)+'" placeholder="Ex.: CH-104"></div>'+
          '</div>'+
          '<div class="field"><label class="field-label">Foto do equipamento</label>'+ renderPhotoBox("equipamento", w.equipamentoAssetId)+'</div>'+
        '</div>'+
      '</div>'
    );
  }

  function renderPhotoBox(kind, assetId){
    var url = assetId ? assetUrl(assetId) : null;
    var caption = kind==="cracha" ? "📇 Toque para fotografar o crachá" : "📷 Toque para fotografar o equipamento";
    return (
      '<label class="photo-box '+(url?"filled":"")+'">'+
        (url ? '<img src="'+url+'" alt="foto">' : '')+
        '<span class="photo-caption">'+caption+'</span>'+
        '<input type="file" accept="image/*" capture="environment" style="display:none" data-photo-input="'+kind+'">'+
        (url ? '<button type="button" class="photo-retake" data-action="retake-photo" data-kind="'+kind+'">Refazer</button>' : '')+
      '</label>'
    );
  }

  // Photo box for checklist "Problema" items — no capture attribute, so the
  // device picker offers both "Câmera" and "Galeria" instead of forcing the camera.
  function renderItemPhotoBox(itemId, assetId, missing){
    var url = assetId ? assetUrl(assetId) : null;
    return (
      '<label class="photo-box item-photo '+(url?"filled":"")+' '+(missing?"missing":"")+'" style="min-height:96px; margin-top:8px;">'+
        (url ? '<img src="'+url+'" alt="foto do problema">' : '')+
        '<span class="photo-caption">📷 Foto obrigatória do problema<br><span style="font-size:11.5px; font-weight:600;">tirar foto ou escolher da galeria</span></span>'+
        '<input type="file" accept="image/*" style="display:none" data-photo-input="problema:'+itemId+'">'+
        (url ? '<button type="button" class="photo-retake" data-action="retake-item-photo" data-item="'+itemId+'">Refazer</button>' : '')+
      '</label>'
    );
  }

  function stepChecklist(w){
    var tmpl = CHECKLIST_TEMPLATES[w.frotaTipo] || {sections:[]};
    var html = '<div class="stack">';
    html += '<div class="card field-grid">'+
      '<div class="field"><label class="field-label">Horímetro</label><input type="text" inputmode="decimal" class="mono" id="in-horimetro" value="'+escapeHtml(w.horimetro)+'" placeholder="Ex.: 4380.5"></div>'+
      '<div class="field"><label class="field-label">Data</label><input type="date" id="in-dataServico" value="'+w.dataServico+'"></div>'+
    '</div>';
    if(tmpl.generic){
      html += '<div class="banner banner-warn">Checklist padrão genérico para '+tmpl.label+'. Envie o caderno padrinho deste equipamento para configurar os itens específicos.</div>';
    }
    html += '<div class="card">';
    tmpl.sections.forEach(function(sec){
      html += '<div class="checklist-section"><div class="checklist-section-title">'+escapeHtml(sec.title)+'</div>';
      sec.items.forEach(function(item){
        var entry = w.checklist[item.id]||{};
        var val = entry.status || "";
        var obs = entry.obs || "";
        var missingPhoto = val==="problema" && !entry.fotoAssetId;
        html += (
          '<div class="checklist-item">'+
            '<div class="checklist-item-head"><div class="checklist-item-text"><span class="checklist-item-num">'+item.id+'</span>'+escapeHtml(item.text)+'</div></div>'+
            '<div class="segmented" data-item="'+item.id+'">'+
              '<button type="button" data-val="ok" class="'+(val==="ok"?"active":"")+'">OK</button>'+
              '<button type="button" data-val="problema" class="'+(val==="problema"?"active":"")+'">Problema</button>'+
              '<button type="button" data-val="na" class="'+(val==="na"?"active":"")+'">N/A</button>'+
            '</div>'+
            (val==="problema" ? '<textarea placeholder="Descreva o problema encontrado…" data-obs="'+item.id+'" style="margin-top:8px;">'+escapeHtml(obs)+'</textarea>' : '')+
            (val==="problema" ? renderItemPhotoBox(item.id, entry.fotoAssetId, missingPhoto) : '')+
            (missingPhoto ? '<div class="muted" style="color:var(--red); font-size:12px; font-weight:700; margin-top:5px;">⚠️ Anexe uma foto para continuar</div>' : '')+
          '</div>'
        );
      });
      html += '</div>';
    });
    html += '</div>';
    html += '<div class="card field"><label class="field-label">Observações gerais</label>'+
      '<textarea id="in-obsGeral" placeholder="Alguma observação adicional sobre a inspeção…">'+escapeHtml(w.obsGeral)+'</textarea></div>';
    html += '</div>';
    return html;
  }

  function stepPecas(w){
    var html = '<div class="stack">';
    html += '<div class="banner banner-ok">Liste as peças que o líder precisa separar para pendências futuras. Deixe em branco se não precisar de nenhuma.</div>';
    html += '<div class="card">';
    w.pecas.forEach(function(p, idx){
      html += (
        '<div class="part-row" data-part="'+p.id+'">'+
          '<div class="field" style="flex:1.4;"><label class="field-label">Peça '+(idx+1)+'</label><input type="text" data-part-field="nome" value="'+escapeHtml(p.nome)+'" placeholder="Ex.: Mangueira hidráulica L.D."></div>'+
          '<div class="field" style="flex:.5;"><label class="field-label">Qtd.</label><input type="text" inputmode="numeric" class="mono" data-part-field="qtd" value="'+escapeHtml(p.qtd)+'" placeholder="1"></div>'+
          (w.pecas.length>1 ? '<button type="button" class="part-remove" data-action="remove-part" data-id="'+p.id+'" title="Remover">×</button>' : '<span style="width:26px;"></span>')+
        '</div>'+
        '<div class="field" style="padding:0 0 10px;"><input type="text" data-part-field="obs" value="'+escapeHtml(p.obs)+'" placeholder="Observação (opcional)"></div>'
      );
    });
    html += '<button type="button" class="btn btn-ghost" data-action="add-part">+ Adicionar peça</button>';
    html += '</div></div>';
    return html;
  }

  function stepRevisao(w){
    var tmpl = CHECKLIST_TEMPLATES[w.frotaTipo];
    var itemsChecked = Object.keys(w.checklist).filter(function(k){ return w.checklist[k].status; }).length;
    var totalItems = tmpl.sections.reduce(function(a,s){ return a+s.items.length; },0);
    var problemas = Object.keys(w.checklist).filter(function(k){ return w.checklist[k].status==="problema"; }).length;
    var pecasValidas = w.pecas.filter(function(p){ return p.nome.trim(); });
    return (
      '<div class="stack">'+
        '<div class="card stack">'+
          '<h3>Resumo</h3>'+
          '<div class="row-between"><span class="muted">Mecânico</span><span>'+escapeHtml(state.mecNome)+' · <span class="mono">'+escapeHtml(state.mecMatricula)+'</span></span></div>'+
          '<div class="row-between"><span class="muted">Frota</span><span>'+tmpl.label+' '+escapeHtml(w.frotaNumero)+'</span></div>'+
          '<div class="row-between"><span class="muted">Horímetro</span><span class="mono">'+escapeHtml(w.horimetro||"—")+'</span></div>'+
          '<div class="row-between"><span class="muted">Data</span><span>'+fmtDate(w.dataServico)+'</span></div>'+
          '<div class="row-between"><span class="muted">Checklist preenchido</span><span>'+itemsChecked+' de '+totalItems+'</span></div>'+
          (problemas>0 ? '<div class="banner banner-danger">⚠️ '+problemas+' item(ns) marcados como Problema</div>' : '')+
        '</div>'+
        '<div class="card stack">'+
          '<h3>Peças a solicitar</h3>'+
          (pecasValidas.length===0
            ? '<p class="muted" style="font-weight:600;">Nenhuma peça será solicitada — a OS será encerrada assim que enviada.</p>'
            : '<div class="stack">'+pecasValidas.map(function(p){
                return '<div class="row-between"><span style="font-weight:600;">'+escapeHtml(p.nome)+'</span><span class="mono muted">x'+escapeHtml(p.qtd||"1")+'</span></div>';
              }).join("")+'</div>')+
        '</div>'+
      '</div>'
    );
  }

    var os = state.lastSubmittedOs;

  function viewMecApply(){

  function viewLiderHome(){
    var all = osList();
    var fila = all.filter(function(o){ return o.status==="pecas_pendentes"; });
    var emAndamento = all.filter(function(o){ return o.status==="aguardando_assinatura" || o.status==="aguardando_aplicacao"; });
    var historico = all.filter(function(o){ return o.status==="concluida"; });
    var html = '<div class="stack">';
    html += '<p class="eyebrow">Líder</p><h1 style="margin-top:4px;">Fila de peças 📋</h1>';

      '<div class="kpi yellow"><div class="kpi-num">'+fila.length+'</div><div class="kpi-label">A separar</div></div>'+
      '<div class="kpi blue"><div class="kpi-num">'+emAndamento.length+'</div><div class="kpi-label">Em andamento</div></div>'+
      '<div class="kpi green"><div class="kpi-num">'+historico.length+'</div><div class="kpi-label">Concluídas</div></div>'+
    '</div>';
    html += '<div class="tabs">'+
      '<button class="tab-btn '+(state.liderTab==="fila"?"active":"")+'" data-action="lider-tab" data-tab="fila">Fila &amp; andamento</button>'+
      '<button class="tab-btn '+(state.liderTab==="historico"?"active":"")+'" data-action="lider-tab" data-tab="historico">Histórico</button>'+
    '</div>';

      var active = fila.concat(emAndamento);

        ? '<div class="empty-state"><div class="icon">📭</div>Nenhum pedido de peça pendente.</div>'

      '<div class="os-top">'+

  function viewLiderDetail(){
    var os = findOs(state.currentOsId);
    if(!os) return '<div class="empty-state">OS não encontrada.</div>';
    var tmpl = CHECKLIST_TEMPLATES[os.frotaTipo] || {label:os.frotaTipo, sections:[]};
    var problemas = [];
    Object.keys(os.checklist||{}).forEach(function(k){
      var c = os.checklist[k];
      if(c && c.status==="problema"){
        var item = null;
        tmpl.sections.forEach(function(s){ s.items.forEach(function(it){ if(it.id===k) item=it; }); });
        problemas.push({ id:k, text: item?item.text:k, obs:c.obs, fotoAssetId:c.fotoAssetId });
      }
    });
    var html = '<div class="stack">';
    html += '<button class="back-link" data-action="go-lider-home">← Voltar para a fila</button>';
    html += '<div class="row-between"><div><p class="eyebrow">'+escapeHtml(os.osCode)+'</p><h1 style="margin-top:2px;">'+tmpl.label+' '+escapeHtml(os.frotaNumero)+'</h1></div>'+
      '<span class="pill '+(STATUS_PILL_CLASS[os.status]||"pill-gray")+'">'+(STATUS_LABEL[os.status]||os.status)+'</span></div>';
    html += '<div class="card stack">'+
      '<div class="row-between"><span class="muted">Mecânico</span><span style="font-weight:600;">'+escapeHtml(os.mecanicoNome)+' · <span class="mono">'+escapeHtml(os.mecanicoMatricula)+'</span></span></div>'+
      '<div class="row-between"><span class="muted">Horímetro</span><span class="mono">'+escapeHtml(os.horimetro||"—")+'</span></div>'+
      '<div class="row-between"><span class="muted">Data</span><span style="font-weight:600;">'+fmtDate(os.dataServico)+'</span></div>'+
      (os.equipamentoAssetId ? '<img src="'+assetUrl(os.equipamentoAssetId)+'" style="width:100%; border-radius:14px; margin-top:4px;" alt="Foto do equipamento">' : '')+
    '</div>';
    if(problemas.length){
      html += '<div class="card stack"><h3 style="color:var(--red);">⚠️ Itens com problema no checklist</h3>';
      html += problemas.map(function(p){
        return '<div><div style="font-size:13.5px; font-weight:600;"><span class="mono muted">'+p.id+'</span> '+escapeHtml(p.text)+'</div>'+
          (p.obs?('<div class="muted" style="font-size:12.5px; margin-top:2px; font-weight:600;">'+escapeHtml(p.obs)+'</div>'):'')+
          (p.fotoAssetId?('<img src="'+assetUrl(p.fotoAssetId)+'" alt="Foto do problema" style="width:100%; max-width:220px; border-radius:12px; margin-top:6px; display:block;">'):'')+'</div>';
      }).join('<hr class="divider">');
      html += '</div>';

  /* ---------------------------------------------------------------
   * Signature pad
   * ------------------------------------------------------------- */
  var sigCtx = null, sigCanvas = null, sigLast = null;
  function initSignaturePad(){
    sigCanvas = document.getElementById("sig-canvas");
    if(!sigCanvas) return;
    var ratio = window.devicePixelRatio || 1;
    var rect = sigCanvas.getBoundingClientRect();
    sigCanvas.width = rect.width * ratio;
    sigCanvas.height = rect.height * ratio;
    sigCtx = sigCanvas.getContext("2d");
    sigCtx.scale(ratio, ratio);
    var styles = getComputedStyle(document.documentElement);
    sigCtx.strokeStyle = styles.getPropertyValue("--text").trim() || "#000";
    sigCtx.lineWidth = 2.4;
    sigCtx.lineCap = "round";
    sigCtx.lineJoin = "round";
    function pos(e){
      var r = sigCanvas.getBoundingClientRect();
      var cx = (e.touches ? e.touches[0].clientX : e.clientX);
      var cy = (e.touches ? e.touches[0].clientY : e.clientY);
      return { x: cx - r.left, y: cy - r.top };
    }
    function start(e){ e.preventDefault(); state.sigDrawing = true; sigLast = pos(e); }
    function move(e){
      if(!state.sigDrawing) return;
      e.preventDefault();
      var p = pos(e);
      sigCtx.beginPath(); sigCtx.moveTo(sigLast.x, sigLast.y); sigCtx.lineTo(p.x, p.y); sigCtx.stroke();
      sigLast = p; state.sigHasStroke = true;
    }
    function end(){ state.sigDrawing = false; }
    sigCanvas.addEventListener("pointerdown", start);
    sigCanvas.addEventListener("pointermove", move);
    window.addEventListener("pointerup", end);
    sigCanvas.addEventListener("touchstart", start, {passive:false});
    sigCanvas.addEventListener("touchmove", move, {passive:false});
    sigCanvas.addEventListener("touchend", end);
  }
  function clearSignature(){
    if(sigCtx && sigCanvas){ sigCtx.clearRect(0,0,sigCanvas.width, sigCanvas.height); }
    state.sigHasStroke = false;
  }

  /* ---------------------------------------------------------------
   * Event wiring
   * ------------------------------------------------------------- */
  function afterRender(){
    if(state.route==="mec-signature"){ initSignaturePad(); }

    app.querySelectorAll("[data-photo-input]").forEach(function(input){
      input.addEventListener("change", function(e){
        var file = e.target.files && e.target.files[0];
        if(!file) return;
        var kind = input.getAttribute("data-photo-input");
        state.busy = true; render();
        uploadImage(file).then(function(id){
          state.busy = false;
          if(kind==="cracha"){ state.wizard.crachaAssetId = id; }
          else if(kind==="equipamento"){ state.wizard.equipamentoAssetId = id; }
          else if(kind.indexOf("problema:")===0){
            var itemId = kind.slice("problema:".length);
            var entry = state.wizard.checklist[itemId] || {};
            entry.fotoAssetId = id;
            state.wizard.checklist[itemId] = entry;
          }
          if(!id){ state.error = "Não foi possível salvar a foto agora. Tente novamente."; }
          render();
        });
      });
    });

    app.querySelectorAll(".segmented[data-item]").forEach(function(seg){
      seg.querySelectorAll("button").forEach(function(btn){
        btn.addEventListener("click", function(){
          var itemId = seg.getAttribute("data-item");
          var val = btn.getAttribute("data-val");
          var cur = state.wizard.checklist[itemId] || {};
          cur.status = (cur.status===val ? "" : val);
          state.wizard.checklist[itemId] = cur;
          render();
        });
      });
    });
    app.querySelectorAll("textarea[data-obs]").forEach(function(ta){
      ta.addEventListener("input", function(){
        var id = ta.getAttribute("data-obs");
        var cur = state.wizard.checklist[id] || {};
        cur.obs = ta.value;
        state.wizard.checklist[id] = cur;
      });
    });

    app.querySelectorAll("[data-part]").forEach(function(row){
      var id = row.getAttribute("data-part");
      row.querySelectorAll("[data-part-field]").forEach(function(inp){
        inp.addEventListener("input", function(){
          var part = state.wizard.pecas.find(function(p){ return p.id===id; });
          if(part) part[inp.getAttribute("data-part-field")] = inp.value;
        });
      });
    });

    bindInput("in-mecNome", function(v){ state.mecNome = v; });
    bindInput("in-mecMatricula", function(v){ state.mecMatricula = v; });
    bindInput("in-frotaNumero", function(v){ state.wizard.frotaNumero = v; });
    bindInput("in-horimetro", function(v){ state.wizard.horimetro = v; });
    bindInput("in-dataServico", function(v){ state.wizard.dataServico = v; });
    bindInput("in-obsGeral", function(v){ state.wizard.obsGeral = v; });
    bindInput("in-liderNome", function(v){ state.liderNome = v; });

    var tipoSel = document.getElementById("in-frotaTipo");
    if(tipoSel){
      tipoSel.addEventListener("change", function(){
        state.wizard.frotaTipo = tipoSel.value;
        state.wizard.checklist = {};
        render();
      });
    }

    var q = document.getElementById("in-consultaQ");
    if(q){ q.addEventListener("input", function(){ state.consultaFilters.q = q.value; renderConsultaListOnly(); }); }
    var ct = document.getElementById("in-consultaTipo");
    if(ct){ ct.addEventListener("change", function(){ state.consultaFilters.tipo = ct.value; render(); }); }
    var cs = document.getElementById("in-consultaStatus");
    if(cs){ cs.addEventListener("change", function(){ state.consultaFilters.status = cs.value; render(); }); }

    app.addEventListener("click", onClick);
  }

  function renderConsultaListOnly(){
    // lightweight re-render for text search to avoid stealing input focus every keystroke
    render();
    var q2 = document.getElementById("in-consultaQ");
    if(q2){ q2.focus(); var v=q2.value; q2.value=""; q2.value=v; }
  }

  function bindInput(id, setter){
    var el = document.getElementById(id);
    if(!el) return;
    el.addEventListener("input", function(){ setter(el.value); });
    el.addEventListener("blur", function(){
      if(id==="in-mecNome") lsSet("af_mecNome", state.mecNome);
      if(id==="in-mecMatricula") lsSet("af_mecMatricula", state.mecMatricula);
      if(id==="in-liderNome") lsSet("af_liderNome", state.liderNome);
    });
  }

  function onClick(e){
    var t = e.target.closest("[data-action]");
    if(!t) return;
    var action = t.getAttribute("data-action");
    state.error = null;

    if(action==="pick-role"){
      state.role = t.getAttribute("data-role");
      lsSet("af_role", state.role);
      state.route = state.role==="lider" ? "lider-home" : "mec-home";
      render(); return;
    }
    if(action==="switch-role"){ state.role = null; state.route = "gate"; lsSet("af_role", null); render(); return; }
    if(action==="cycle-theme"){ cycleTheme(); return; }
    if(action==="nav-goto"){ state.route = t.getAttribute("data-route"); state.currentOsId=null; render(); return; }
    if(action==="go-mec-home"){ state.route="mec-home"; state.currentOsId=null; render(); return; }
    if(action==="go-lider-home"){ state.route="lider-home"; state.currentOsId=null; render(); return; }

    if(action==="new-apontamento"){ state.wizard = freshWizard(); state.route = "mec-wizard"; render(); return; }
    if(action==="wizard-back"){ state.wizard.step = Math.max(1, state.wizard.step-1); render(); return; }
    if(action==="wizard-next"){
      if(state.wizard.step===1){ lsSet("af_mecNome", state.mecNome); lsSet("af_mecMatricula", state.mecMatricula); }
      if(state.wizard.step===2 && missingProblemPhotos(state.wizard).length>0){
        state.error = "Anexe uma foto em cada item marcado como Problema antes de continuar.";
        render(); return;
      }
      state.wizard.step = Math.min(4, state.wizard.step+1);
      render(); return;
    }
    if(action==="wizard-submit"){ submitWizard(); return; }

    if(action==="retake-photo"){
      var kind = t.getAttribute("data-kind");
      if(kind==="cracha") state.wizard.crachaAssetId = null; else state.wizard.equipamentoAssetId = null;
      render(); return;
    }
    if(action==="retake-item-photo"){
      var pItemId = t.getAttribute("data-item");
      var pEntry = state.wizard.checklist[pItemId];
      if(pEntry) pEntry.fotoAssetId = null;
      render(); return;
    }
    if(action==="add-part"){ state.wizard.pecas.push({ id: uid(), nome:"", qtd:"1", obs:"" }); render(); return; }
    if(action==="remove-part"){
      var pid = t.getAttribute("data-id");
      state.wizard.pecas = state.wizard.pecas.filter(function(p){ return p.id!==pid; });
      render(); return;
    }

    if(action==="open-signature"){ state.currentOsId = t.getAttribute("data-id"); state.route = "mec-signature"; render(); return; }
    if(action==="open-apply"){ state.currentOsId = t.getAttribute("data-id"); state.route = "mec-apply"; render(); return; }
    if(action==="sig-clear"){ clearSignature(); return; }
    if(action==="sig-confirm"){ confirmSignature(); return; }
    if(action==="send-os-email"){
      if(state.lastSubmittedOs){ openMailto(buildOsEmailMailto(state.lastSubmittedOs).mailto); }
      return;
    }
    if(action==="copy-os-email"){
      if(state.lastSubmittedOs){
        var mail = buildOsEmailMailto(state.lastSubmittedOs);
        copyToClipboard("Para: "+mail.to+"\nAssunto: "+mail.subject+"\n\n"+mail.body).then(function(ok){
          var btn = document.getElementById("btn-copy-email");
          if(btn){ btn.textContent = ok ? "✅ Copiado! Cole no seu e-mail" : "Não foi possível copiar"; }
        });
      }
      return;
    }
    if(action==="apply-confirm"){ confirmApply(); return; }

    if(action==="open-lider-os"){ state.currentOsId = t.getAttribute("data-id"); state.route = "lider-detail"; render(); return; }
    if(action==="lider-tab"){ state.liderTab = t.getAttribute("data-tab"); render(); return; }
    if(action==="lider-confirm-separacao"){ confirmSeparacao(); return; }

    if(action==="open-consulta-os"){ state.consultaOsId = t.getAttribute("data-id"); state.route = "consulta-detail"; render(); return; }
  }

  /* ---------------------------------------------------------------
   * Flows
   * ------------------------------------------------------------- */
  function missingProblemPhotos(w){
    return Object.keys(w.checklist).filter(function(id){
      var e = w.checklist[id];
      return e && e.status==="problema" && !e.fotoAssetId;
    });
  }

  function submitWizard(){
    var w = state.wizard;
    if(!state.mecNome || !state.mecMatricula || !w.frotaNumero){
      state.error = "Preencha nome, matrícula e número da frota antes de enviar.";
      state.wizard.step = 1; render(); return;
    }
    if(missingProblemPhotos(w).length>0){
      state.error = "Anexe uma foto em cada item marcado como Problema antes de enviar.";
      state.wizard.step = 2; render(); return;
    }
    var pecas = w.pecas.filter(function(p){ return p.nome.trim(); }).map(function(p){
      return { id:p.id, nome:p.nome.trim(), qtd:p.qtd||"1", obs:p.obs||"", entregue:false, aplicada:false };
    });
    var data = {
      osCode: genOsCode(), frotaTipo: w.frotaTipo, frotaNumero: w.frotaNumero.trim(),
      mecanicoNome: state.mecNome.trim(), mecanicoMatricula: state.mecMatricula.trim(),
      crachaAssetId: w.crachaAssetId || null, equipamentoAssetId: w.equipamentoAssetId || null,
      horimetro: w.horimetro || "", dataServico: w.dataServico,
      checklist: w.checklist, obsGeral: w.obsGeral || "", pecas: pecas,
      status: pecas.length ? "pecas_pendentes" : "concluida",
      liderNome: null, liderSepararEm: null, assinaturaAssetId: null, assinaturaEm: null
    };
    state.busy = true; render();
    createOs(data).then(function(){
notifyPowerAutomate(data);
      state.busy = false; state.wizard = null;
      state.lastSubmittedOs = data;
      state.route = "mec-submitted";
      render();
    }).catch(function(){
      state.busy = false; state.error = "Não foi possível enviar o apontamento agora. Tente novamente.";
      render();
    });
  }

  function confirmSeparacao(){
    var os = findOs(state.currentOsId);
    if(!os) return;
    var checks = app.querySelectorAll("[data-separar-id]");
    var selected = {};
    checks.forEach(function(c){ selected[c.getAttribute("data-separar-id")] = c.checked; });
    var updated = (os.pecas||[]).map(function(p){ return Object.assign({}, p, { entregue: !!selected[p.id] }); });
    if(!updated.some(function(p){ return p.entregue; })){
      state.error = "Marque ao menos uma peça para liberar a entrega.";
      render(); return;
    }
    var nome = (document.getElementById("in-liderNome")||{}).value || state.liderNome || "";
    lsSet("af_liderNome", nome); state.liderNome = nome;
    state.busy = true; render();
    updateOs(os.id, { pecas: updated, status: "aguardando_assinatura", liderNome: nome, liderSepararEm: new Date().toISOString() })
      .then(function(){ state.busy = false; state.route = "lider-home"; state.currentOsId = null; render(); })
      .catch(function(){ state.busy = false; state.error = "Não foi possível salvar a separação agora."; render(); });
  }

  function confirmSignature(){
    var os = findOs(state.currentOsId);
    if(!os) return;
    if(!state.sigHasStroke){ state.error = "Assine no campo indicado antes de confirmar."; render(); return; }
    state.busy = true; render();
    blobFromCanvas(sigCanvas).then(function(blob){ return uploadImage(blob); })
      .then(function(assetId){
        return updateOs(os.id, { assinaturaAssetId: assetId, assinaturaEm: new Date().toISOString(), status: "aguardando_aplicacao" });
      })
      .then(function(){ state.busy = false; state.route = "mec-home"; state.currentOsId = null; render(); })
      .catch(function(){ state.busy = false; state.error = "Não foi possível salvar a assinatura agora."; render(); });
  }

  function confirmApply(){
    var os = findOs(state.currentOsId);
    if(!os) return;
    var checks = app.querySelectorAll("[data-apply-id]");
    var selected = {};
    checks.forEach(function(c){ selected[c.getAttribute("data-apply-id")] = c.checked; });
    var updated = (os.pecas||[]).map(function(p){ return p.entregue ? Object.assign({}, p, { aplicada: !!selected[p.id] }) : p; });
    state.busy = true; render();
    updateOs(os.id, { pecas: updated, status: "concluida", concluidaEm: new Date().toISOString() })
      .then(function(){ state.busy = false; state.route = "mec-home"; state.currentOsId = null; render(); })
      .catch(function(){ state.busy = false; state.error = "Não foi possível concluir a OS agora."; render(); });
  }

  /* ---------------------------------------------------------------
   * Boot
   * ------------------------------------------------------------- */
  function bootFirebase(){
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      var auth = firebase.auth();
      auth.onAuthStateChanged(function(user){
        if(user && !db){
          db = firebase.firestore();
          var storage = firebase.storage();
          assetsApi = {
            upload: function(blob){
              var ext = (blob && blob.type && blob.type.indexOf("png")>-1) ? "png" : "jpg";
              var path = "os_photos/" + Date.now() + "_" + uid() + "." + ext;
              var ref = storage.ref().child(path);
              return ref.put(blob, { contentType: (blob && blob.type) || "image/jpeg" })
                .then(function(snap){ return snap.ref.getDownloadURL(); })
                .then(function(url){ return { id: url }; });
            }
          };
          subscribe();
        }
      });
      auth.signInAnonymously().catch(function(err){
        state.error = "Não foi possível conectar ao banco de dados (login): " + (err && err.message ? err.message : "");
        render();
      });
    }catch(e){
      state.error = "Não foi possível iniciar a conexão com o banco de dados.";
      render();
    }
  }

  function boot(){
    applyTheme(state.theme);
    if(state.role){ state.route = state.role==="lider" ? "lider-home" : "mec-home"; }
    render();

    if(window.claude && window.claude.use){
      Promise.all([
        window.claude.use("db").catch(function(){ return null; }),
        window.claude.use("assets").catch(function(){ return null; })
      ]).then(function(res){
        db = res[0]; assetsApi = res[1];
        if(!db){ state.error = "Sem conexão com o banco de dados nesta visualização — os dados ficam apenas nesta sessão."; }
        subscribe();
      });
      return;
    }

    if(typeof firebase !== "undefined" && FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey){
      bootFirebase();
      return;
    }

    render();
  }

  var start = function(){ boot(); };
  if(window.claude && window.claude.hot){
    window.claude.hot.ready ? window.claude.hot.ready(start) : start();
  } else {
    start();
  }
})();
</script>
